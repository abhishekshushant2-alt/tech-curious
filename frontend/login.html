<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Curious — Secure Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230D1A12'/%3E%3Ctext x='32' y='42' font-family='monospace' font-weight='700' font-size='26' fill='%23E6C34A' text-anchor='middle'%3ETC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-bg text-silk font-sans min-h-screen flex flex-col">

<header class="border-b border-line">
  <nav class="max-w-6xl mx-auto px-7 py-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-brass to-copper flex items-center justify-center shadow-[0_0_20px_-4px_rgba(230,195,74,0.55)]">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#0D1A12" stroke-width="2" stroke-linecap="round">
          <rect x="7" y="7" width="10" height="10" rx="2"/>
          <path d="M7 3v2M12 3v2M17 3v2M7 19v2M12 19v2M17 19v2M3 7h2M3 12h2M3 17h2M19 7h2M19 12h2M19 17h2"/>
        </svg>
      </span>
      <span class="font-mono font-semibold text-[16px] tracking-wide">Tech Curious</span>
    </a>
    <a href="index.html" class="font-mono text-[13px] text-silkDim hover:text-silk transition">← Back to archive</a>
  </nav>
</header>

<main class="flex-1 flex items-center justify-center px-7 py-16">
  <div class="w-full max-w-sm">
    <div class="font-mono text-[12.5px] tracking-[0.14em] text-copper uppercase mb-3 flex items-center gap-2.5">
      <span class="w-5 h-px bg-copper"></span> Secure Portal
    </div>
    <h1 class="font-mono font-bold text-2xl mb-2">Authorized access only</h1>
    <p class="text-silkDim text-sm mb-8">Sign in to upload and manage builds.</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="adminId" class="block font-mono text-xs text-silkDim mb-1.5">Admin ID</label>
        <input id="adminId" name="adminId" type="text" required autocomplete="username"
          class="w-full bg-bgElev border border-line rounded-xl px-4 py-3 text-silk placeholder:text-silkDim/50 focus:outline-none focus:border-brass transition"
          placeholder="admin">
      </div>
      <div>
        <label for="passcode" class="block font-mono text-xs text-silkDim mb-1.5">Passcode</label>
        <input id="passcode" name="passcode" type="password" required autocomplete="current-password"
          class="w-full bg-bgElev border border-line rounded-xl px-4 py-3 text-silk placeholder:text-silkDim/50 focus:outline-none focus:border-brass transition"
          placeholder="••••••••">
      </div>

      <p id="errorMsg" class="hidden text-xs font-mono text-copper"></p>

      <button type="submit"
        class="w-full font-mono text-sm px-5 py-3 rounded-xl bg-brass text-bg font-semibold hover:bg-brassBright transition">
        Verify access →
      </button>
    </form>
  </div>
</main>

<script src="js/admin.js"></script>
</body>
</html>
